<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SubtitleCat Preferences</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        font-size: 14px;
        line-height: 1.4;
      }
      body {
        margin: 0;
        padding: 24px;
        background: transparent;
      }
      main {
        max-width: 520px;
      }
      .preference-group {
        margin-bottom: 24px;
      }
      .preference-group h3 {
        margin: 0 0 12px 0;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        opacity: 0.6;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .row label {
        font-weight: 600;
        margin-bottom: 0;
      }
      select {
        font-size: 13px;
        padding: 3px 6px;
        border-radius: 5px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        background: transparent;
        color: inherit;
      }
      @media (prefers-color-scheme: dark) {
        select {
          border-color: rgba(255, 255, 255, 0.2);
        }
      }
      .hint {
        margin: 4px 0 0 0;
        color: rgba(0, 0, 0, 0.7);
        font-size: 13px;
      }
      @media (prefers-color-scheme: dark) {
        .hint {
          color: rgba(255, 255, 255, 0.7);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="preference-group">
        <h3>Preferred Language</h3>
        <div class="row">
          <label for="language-select">Chinese variant:</label>
          <select id="language-select">
            <option value="zh-TW">Traditional Chinese (繁體 zh-TW)</option>
            <option value="zh-CN">Simplified Chinese (简体 zh-CN)</option>
          </select>
        </div>
        <p class="hint">
          When both variants are available, the preferred one is downloaded. The other is used as a fallback.
        </p>
      </div>
    </main>
    <script>
      (function () {
        const languageSelect = document.getElementById('language-select');
        const iinaApi = window.iina || {};
        const prefs = iinaApi.preferences;

        function readPreference(key, defaultValue) {
          if (!prefs || typeof prefs.get !== 'function') {
            return defaultValue;
          }
          try {
            const value = prefs.get(key);
            return typeof value === 'undefined' ? defaultValue : value;
          } catch (error) {
            console.error('[SubtitleCat] Failed to read preference', error);
            return defaultValue;
          }
        }

        function writePreference(key, value) {
          if (!prefs || typeof prefs.set !== 'function') {
            return;
          }
          try {
            prefs.set(key, value);
            if (typeof prefs.sync === 'function') {
              prefs.sync();
            }
          } catch (error) {
            console.error('[SubtitleCat] Failed to persist preference', error);
          }
        }

        if (languageSelect) {
          const saved = readPreference('preferredLanguage', 'zh-TW');
          const validOptions = Array.from(languageSelect.options).map(o => o.value);
          languageSelect.value = validOptions.includes(saved) ? saved : 'zh-TW';
          languageSelect.addEventListener('change', () =>
            writePreference('preferredLanguage', languageSelect.value)
          );
        }
      })();
    </script>
  </body>
</html>
